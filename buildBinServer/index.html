    <script>
      AFRAME.registerComponent("recolor", {
        schema: {
          default: "#fca",
        },
        init: function () {
          this.el.addEventListener("model-loaded", () => {
            const mesh = this.el.getObject3D("mesh");
            if (!mesh) return;
            mesh.traverse((node) => {
              if (node.isMesh && node.material) {
                node.material.map = null;

                node.material.color.set(this.data);
                node.material.metalness = 0; // Без металлического блеска
                node.material.roughness = 1; // Полностью матовая поверхность
                node.material.transparent = false; // Без прозрачности
                node.material.opacity = 1.0;
                node.material.needsUpdate = true;
              }
            });
          });
        },
      });
    </script>

    <script
      type="text/javascript"
      src="/museum/webvr/data/exdata.json"
    ></script>

        ></a-entity>
      </a-entity>

      <script>
        document.addEventListener("DOMContentLoaded", function () {
          var isMobile = /Mobi|Android/i.test(navigator.userAgent);
          var movementControls = document.querySelector("#cameraRig");

          if (isMobile) {
            movementControls.setAttribute(
              "movement-controls",
              "enabled",
              "false"
            );
          } else {
            movementControls.setAttribute(
              "movement-controls",
              "enabled",
              "true"
            );
          }
        });
